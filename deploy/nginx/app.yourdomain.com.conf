# Reference config for the host's Nginx (NOT run inside Docker).
# Copy to /etc/nginx/sites-available/app.yourdomain.com.conf on the droplet,
# replace yourdomain.com, then symlink into sites-enabled and reload Nginx.
# Run `certbot --nginx -d app.yourdomain.com` afterwards — it will rewrite
# this file to add the TLS (443) block automatically.

server {
    listen 80;
    server_name app.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
